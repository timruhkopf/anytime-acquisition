# Basin decomposition of static arms and exact, luck-corrected option labels (tasks/option_headroom.py,
# experimental/options.py; research_log/decisions/0008). Pre-registration: notebooks/12_2026-11-12_option_headroom.ipynb.
name: option_headroom
d: 2
pfn: pfn_large
n_init_per_d: 2
T_per_d: 10
candidates: {n_sobol: 1024, n_local: 64, local_sigmas: [0.01, 0.05, 0.2]}  # sizes of every arm's (fixed) set
arms: [ei, pi0.01, ucb0.995, mes, mean]   # static_tune's portfolio minus es (needs the alpha-PFN)
seeds: [0, 1]            # candidate-set seeds: the luck replicates
ks: [1, 3, 5]            # option lengths
n_null: 2                # null options ei@j (EI over a fixed random half of the candidates)
part_a: {split: 0, task_offset: 0, n_tasks: 500}
part_b: {split: 4, task_offset: 20000, n_tasks: 800, t_max: 15}   # fresh label tasks (round-1/2 used 0..11999)
task_draw: {n_dense: 16384, n_refine: 16, refine_steps: 200}
descent: {steps: 300, lr: 0.003, check_steps: 600, check_lr: 0.001, chunk: 65536}
deltas: [1, 10]          # good basin: descended value within delta PFN bins of f*
eps: 1.0e-6              # log10(regret + eps); f*'s accuracy at d = 2 (sanity: 1e-7 let lanes that set f* get -7)
primary_k: 3
worthwhile_log10: 0.022  # = 5% less regret
n_boot: 2000
tf32: false
device: cuda
chunk: 256
