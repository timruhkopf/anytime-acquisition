# A one-deviation option policy learned from exact option labels (tasks/option_policy.py,
# experimental/option_policy.py, analysis/option_policy.py). Pre-registration: notebooks/13_2026-11-12_option_policy.ipynb.
name: option_policy
d: 2
pfn: pfn_large
n_init_per_d: 2
T_per_d: 10
candidates: {n_sobol: 1024, n_local: 64, local_sigmas: [0.01, 0.05, 0.2]}  # every arm's deterministic set
base: ei                 # the base policy pi_0: the prefix, and what every option returns to
arms: [ei, pi0.01, ucb0.995, mes, mean]   # options are the arms other than the base
ks: [3]                  # option lengths in steps
rest: true               # plus "arm a for the rest of the run"
steps: [0, 2, 4, 6, 8, 10, 12, 14]        # decision steps
seeds: [0, 1]            # candidate-set seeds (luck replicates); the policy is deployed under seeds[0]
tasks: {split: 4, task_offset: 30000, n_tasks: 2000}   # fresh label tasks (option_headroom used 20000..20799)
task_chunk: 500          # tasks per collection chunk
task_draw: {n_dense: 16384, n_refine: 16, refine_steps: 200}
eps: 1.0e-6              # log10(regret + eps)
portfolios:              # options the policy may choose from, by arm
  nomes: [pi0.01, ucb0.995, mean]
  all: [pi0.01, ucb0.995, mes, mean]
feature_sets: [time, data, belief, pfn]   # each with the mlp; belief also with ridge
z_pca: 32
fit: {width: 128, epochs: 150, patience: 15, batch: 1024, lr: 2.0e-3, weight_decay: 1.0e-3, dropout: 0.1, n_ens: 2}
n_folds: 5
n_inner: 4
primary: nomes/belief/mlp
worthwhile_log10: 0.022  # = 5% less regret
n_boot: 2000
tf32: false
device: cuda
chunk: 256
